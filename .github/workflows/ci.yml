name: CI Test & Build Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run SQLite, CWA & Serverless API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-streamlit.txt

      - name: Verify Python Syntax & Bytecode Compilation
        run: |
          python -m py_compile database.py cwa_api.py streamlit_app.py test_db.py test_weather_api.py api/weather.py

      - name: Run Database & Parsing Test Suite
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          python test_db.py

      - name: Run Vercel Serverless Weather API & Schema Test Suite
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: |
          python test_weather_api.py
